spring.application.name=paketmanager

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Connexion BDD avec valeurs de repli H2 par défaut (syntaxe ${VAR:default})
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/parceldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Désactiver l'avertissement open-in-view (recommandé pour les API REST)
spring.jpa.open-in-view=false